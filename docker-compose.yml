services:
  app:
    build: .
    ports:
      - "5175:5175"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  relay:
    image: node:24-alpine
    profiles: ["relay"]
    command: ["npx", "-y", "y-websocket@2.1.0"]
    environment:
      HOST: 0.0.0.0
      PORT: "1234"
    ports:
      - "1234:1234"
